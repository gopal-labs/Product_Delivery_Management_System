<!DOCTYPE html>
<html>

<head>
    <title>Order Items</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Order Items</h1>

    <h2>Add Product To Order</h2>

    <form action="/add_order_item" method="POST">

        <label>Order:</label>

        <select name="order_id">

            {% for order in orders %}

            <option value="{{ order[0] }}">
                Order {{ order[0] }}
            </option>

            {% endfor %}

        </select>

        <br><br>

        <label>Product:</label>

        <select name="product_id">

            {% for product in products %}

            <option value="{{ product[0] }}">
                {{ product[1] }}
            </option>

            {% endfor %}

        </select>

        <br><br>

        <label>Quantity:</label>

        <input type="number" name="quantity" required>

        <br><br>

        <button type="submit">
            Add Product
        </button>

    </form>

    <hr>

    <h2>Order Items List</h2>

    <table border="1" cellpadding="10">

        <tr>
            <th>Order Item ID</th>
            <th>Order ID</th>
            <th>Product</th>
            <th>Quantity</th>
            <th>Subtotal</th>
        </tr>

        {% for item in items %}

        <tr>

            <td>{{ item[0] }}</td>
            <td>{{ item[1] }}</td>
            <td>{{ item[2] }}</td>
            <td>{{ item[3] }}</td>
            <td>{{ item[4] }}</td>

        </tr>

        {% endfor %}

    </table>

</body>

</html>
